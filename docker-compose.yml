services:
  app:
    build: .
    image: dev-team-hub:latest
    container_name: dev-team-hub
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Secretos y flags de integración. Arrancar copiando server/.env.example.
    # Importante: definir TZ ahí — con el contenedor en UTC, la rotación de
    # facilitador se corre un día a partir de cierta hora local.
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # La base SQLite va al volumen: sobrevive a rebuilds y reinicios.
      DATABASE_PATH: /data/dev-team-hub.db
    volumes:
      - dth-data:/data

volumes:
  dth-data:
